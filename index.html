    display: flex;
    flex-direction: column;
    gap: 22px;

    margin: 0;
    min-height: 3.9em;

    align-items: center;
    text-wrap: pretty;

    font-weight: 500;
    font-size: 16px;
    letter-spacing: -.005em;
    color: var(--ink);
    background: var(--lavender);
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    cursor: pointer;
    transition: background .15s, transform .08s;

  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .enter { animation: enter .4s cubic-bezier(.2,.7,.3,1); }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
  @media (max-width: 480px) {
    .card { padding: 24px 22px 22px; }
    .excuse { font-size: 19px; min-height: 4.6em; }
  }

    // Shuffled "bag": deal every excuse exactly once before any can repeat.
    var bag = [];
    var lastShown = -1;
    function refillBag() {
      bag = excuses.map(function (_, i) { return i; });
      for (var j = bag.length - 1; j > 0; j--) {        // Fisher-Yates shuffle
        var k = Math.floor(Math.random() * (j + 1));
        var t = bag[j]; bag[j] = bag[k]; bag[k] = t;
      }
      if (bag.length > 1 && bag[bag.length - 1] === lastShown) {
        var s = bag[bag.length - 1]; bag[bag.length - 1] = bag[0]; bag[0] = s;
      }
    }

    function render(animate) {
      if (bag.length === 0) refillBag();
      var i = bag.pop();
      lastShown = i;
      var ex = $("excuse");
      ex.textContent = excuses[i];
      if (animate) {
        ex.classList.remove("enter"); void ex.offsetWidth; ex.classList.add("enter");
      }
    }

    $("gen").addEventListener("click", function () { render(true); });
    render(false);
